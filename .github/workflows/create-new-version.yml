# This workflow creates a new version of the package. Can be used for both dev and prod.
# Package version is determined from pyproject.toml.
# Triggered on pushes/merges to main and can be triggered automatically
name: Create new package version

on:
  workflow_dispatch:
  # push:
  # branches:
  # - 'main'

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Build
        uses: ./.github/actions/build-package

  deploy:
    name: Deploy package
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write # mandatory for Trusted Publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: "true"

  create_github_release:
    name: Create tag & release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-uv@v10.0.1
        with:
          version-file: "pyproject.toml"

      - name: Download artifacts (Wheel & SDist)
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Get package version
        run: |
          VERSION=$(uv version --short)
          echo "::notice::Package Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $VERSION \
              --repo="$GITHUB_REPOSITORY" \
              --title="$VERSION" \
              --generate-notes

      - name: Upload dists to release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $VERSION dist/*

  build_docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - typechecking

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Build Docs
        uses: ./.github/actions/build-docs

  deploy_docs_gh_pages:
    name: Deploy docs to GitHub pages
    runs-on: ubuntu-latest
    needs:
      - build_docs
    if: github.ref_name == 'main'

    permissions:
      contents: "read"
      id-token: "write"
      pages: "write"
      actions: "write"
      checks: "write"
      deployments: "write"

    steps:
      - name: "Download static files from build_docs stage"
        uses: actions/download-artifact@v8.0.1
        with:
          name: "site-files"
          path: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "site/"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
